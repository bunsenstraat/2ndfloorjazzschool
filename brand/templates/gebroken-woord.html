<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gebroken woord — 2nd Floor Jazz School template</title>
<link rel="stylesheet" href="flyer.css">
<style>
.cover { background: var(--paper); color: var(--ink); }
.word { left: 5cqw; top: 5cqw; display: flex; flex-direction: column; font-size: var(--fs, 16.5cqw); line-height: .82; }
.word span:nth-child(even) { color: var(--accent, var(--orange)); }
.side { right: 5.3cqw; top: 23cqw; font: italic 400 6cqw/1.05 "Instrument Serif"; text-align: right; color: #4a4650; }
.info { right: 5.3cqw; bottom: 5.3cqw; text-align: right; }
.logo { left: 5cqw; bottom: 5.3cqw; width: 34cqw; }

.a4 .word { top: 7cqw; font-size: var(--fs, 23cqw); }
.a4 .side { top: 9cqw; font-size: 7.5cqw; }
.a4 .info { bottom: auto; top: 112cqw; right: auto; left: 5.3cqw; text-align: left; font-size: 3cqw; }
.a4 .contact { right: 5.3cqw; bottom: 6cqw; text-align: right; }
.a4 .logo { bottom: 6cqw; width: 40cqw; }
.a4 .rule { left: 5.3cqw; right: 5cqw; bottom: 14cqw; height: .5cqw; background: var(--ink); }
.square .contact, .square .rule { display: none; }
</style>
</head>
<body>
<div class="cover">
  <div class="word X" id="word"></div>
  <div class="side" id="side"></div>
  <div class="info small" id="info"></div>
  <div class="rule"></div>
  <div class="contact" id="contact"></div>
  <div class="qr" id="qr"><span id="qr-label"></span><div class="code"></div></div>
  <img class="logo" src="logo.svg" alt="2nd Floor Jazz School">
</div>
<div class="help">Pas de tekst aan via de adresbalk, bijv.<br>
<code>?w=Im-pro-vi-se-ren&amp;side=over|akkoorden-|schema’s</code><br>
Het woord wordt bij elk <code>-</code> afgebroken; elke regel verspringt. Opties: <code>format=square|a4</code>, <code>accent=orange|blue|green</code>, <code>size=16</code> (lettergrootte), <code>info=…</code>, <code>contact=…</code>, <code>qr=none</code></div>
<script src="vendor/qrcode.js"></script>
<script src="flyer.js"></script>
<script>
const cover = document.querySelector('.cover');
cover.style.setProperty('--accent', colour(get('accent', 'orange')));
// syllables: every piece but the last keeps its hyphen; each line steps in by a different amount
const parts = get('w', 'Im-pro-vi-se-ren').split('-');
// short words get bigger letters unless a size is given
if (q.has('size')) cover.style.setProperty('--fs', q.get('size') + 'cqw');
else if (parts.length <= 2) cover.style.setProperty('--fs', FORMAT === 'a4' ? '34cqw' : '26cqw');
// on A4 a short, big word fills the width, so the side note moves underneath it
if (parts.length <= 2 && FORMAT === 'a4') document.getElementById('side').style.cssText = 'top:72cqw;font-size:10cqw';
const steps = FORMAT === 'a4' ? [0, 22, 7, 34, 12, 26] : [0, 18, 6, 30, 10, 24];
fill('word', parts.map((p, i) =>
  `<span style="margin-left:${steps[i % steps.length]}cqw">${p}${i < parts.length - 1 ? '-' : ''}</span>`).join(''));
fill('side', lines(get('side', 'over|akkoorden-|schema’s')));
fill('info', lines(get('info', 'Jazzworkshop|voor volwassenen')));
// if the side note runs into the big word, move it below the word instead
document.fonts.ready.then(() => {
  const side = document.getElementById('side');
  const word = document.getElementById('word');
  const cover = document.querySelector('.cover').getBoundingClientRect();
  const slack = cover.width * 0.01; // ignore near-touches
  const hit = (a, b) => a.left + slack < b.right && a.right - slack > b.left && a.top + slack < b.bottom && a.bottom - slack > b.top;
  const s = side.getBoundingClientRect();
  if ([...word.children].some(l => hit(s, l.getBoundingClientRect()))) {
    const top = word.getBoundingClientRect().bottom + cover.width * 0.04;
    const limit = document.getElementById('info').getBoundingClientRect().top - cover.width * 0.03;
    if (top + s.height < limit) side.style.top = (top - cover.top) + 'px'; // only when there is room below
  }
});
</script>
</body>
</html>
